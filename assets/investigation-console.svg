<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">GER1E threat hunting investigation console</title><desc id="d">Animated cobalt CRT investigation console showing telemetry, hypotheses, ATT&amp;CK context, evidence grading, and hunt outcomes.</desc><defs><radialGradient id="bg" cx="66%" cy="38%" r="92%"><stop stop-color="#0a2143"/><stop offset=".48" stop-color="#031022"/><stop offset="1" stop-color="#000207"/></radialGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101923" stop-opacity=".94"/><stop offset="1" stop-color="#07111f" stop-opacity=".94"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#78a9ff" stroke-opacity=".03" stroke-width=".5"/></pattern><filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;letter-spacing:1px}.k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.45px}</style></defs><rect width="720" height="360" rx="12" fill="url(#bg)"/><rect width="720" height="360" rx="12" fill="url(#scan)"/><rect x="6" y="6" width="708" height="348" rx="12" fill="none" stroke="#44d8ff" stroke-opacity=".23"/><g class="m" font-size="10" letter-spacing="1.3" fill="#739bc0"><text x="22" y="27">GER1E // INVESTIGATION CONSOLE</text><text x="698" y="27" text-anchor="end">DEFENDER XDR / SENTINEL</text></g><g transform="translate(22 48)"><rect width="676" height="278" rx="7" fill="url(#panel)" stroke="#2a3d50"/><rect x="1" y="1" width="674" height="27" rx="6" fill="#151f2a"/><circle cx="14" cy="14" r="3" fill="#78a9ff" filter="url(#g)"><animate attributeName="opacity" values=".35;1;.