<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">GER1E threat hunt matrix</title>
<desc id="d">Three public KQL hunts mapped to primary telemetry and investigation value.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02060d"/><stop offset=".55" stop-color="#07111f"/><stop offset="1" stop-color="#02060d"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#78a9ff" stroke-opacity=".035"/></pattern>
  <filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;letter-spacing:1.2px}.s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.35px}</style>
</defs>
<rect width="1200" height="300" rx="10" fill="url(#bg)"/><rect width="1200" height="300" rx="10" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="298" rx="10" fill="none" stroke="#4589ff" stroke-opacity=".28"/>
<g class="m" font-size="10" letter-spacing="1.6" fill="#7f95ad"><text x="24" y="26">HUNT MATRIX // PUBLIC</text><text x="1176" y="26" text-anchor="end">HYPOTHESIS → TELEMETRY → EVIDENCE</text></g>
<path d="M24 44H1176" stroke="#0f62fe" stroke-opacity=".3"/>

<g transform="translate(24 68)"><rect width="356" height="188" rx="8" fill="#07101c" stroke="#4589ff" stroke-opacity=".24"/><text x="18" y="30" class="m" font-size="10" fill="#78a9ff">HUNT_01 // IDENTITY</text><text x="18" y="60" class="h" font-size="15" fill="#f2f7ff">DEVICE-CODE FOLLOW-ON</text><text x="18" y="87" class="s" font-size="10.5" fill="#91a4b7">OAuth device-code sign-in requiring</text><text x="18" y="104" class="s" font-size="10.5" fill="#91a4b7">contextual follow-on investigation.</text><path d="M18 125H338" stroke="#283545"/><text x="18" y="148" class="m" font-size="10" fill="#7f95ad">TELEMETRY</text><text x="112" y="148" class="m" font-size="10.5" fill="#c8d6e5">AADSignInEventsBeta</text><text x="18" y="171" class="m" font-size="10" fill="#7f95ad">VALUE</text><text x="112" y="171" class="m" font-size="10.5" fill="#c8d6e5">identity scoping</text></g>

<g transform="translate(422 68)"><rect width="356" height="188" rx="8" fill="#07101c" stroke="#4589ff" stroke-opacity=".24"/><text x="18" y="30" class="m" font-size="10" fill="#78a9ff">HUNT_02 // NETWORK</text><text x="18" y="60" class="h" font-size="15" fill="#f2f7ff">RARE OUTBOUND BEACONING</text><text x="18" y="87" class="s" font-size="10.5" fill="#91a4b7">Low-volume repeated destinations</text><text x="18" y="104" class="s" font-size="10.5" fill="#91a4b7">surfacing periodic beacon-like cadence.</text><path d="M18 125H338" stroke="#283545"/><text x="18" y="148" class="m" font-size="10" fill="#7f95ad">TELEMETRY</text><text x="112" y="148" class="m" font-size="10.5" fill="#c8d6e5">DeviceNetworkEvents</text><text x="18" y="171" class="m" font-size="10" fill="#7f95ad">VALUE</text><text x="112" y="171" class="m" font-size="10.5" fill="#c8d6e5">C2 triage</text></g>

<g transform="translate(820 68)"><rect width="356" height="188" rx="8" fill="#07101c" stroke="#4589ff" stroke-opacity=".24"/><text x="18" y="30" class="m" font-size="10" fill="#78a9ff">HUNT_03 // PROCESS</text><text x="18" y="60" class="h" font-size="15" fill="#f2f7ff">ENCODED POWERSHELL</text><text x="18" y="87" class="s" font-size="10.5" fill="#91a4b7">Encoded or obfuscated PowerShell</text><text x="18" y="104" class="s" font-size="10.5" fill="#91a4b7">execution summarized for investigation.</text><path d="M18 125H338" stroke="#283545"/><text x="18" y="148" class="m" font-size="10" fill="#7f95ad">TELEMETRY</text><text x="112" y="148" class="m" font-size="10.5" fill="#c8d6e5">DeviceProcessEvents</text><text x="18" y="171" class="m" font-size="10" fill="#7f95ad">VALUE</text><text x="112" y="171" class="m" font-size="10.5" fill="#c8d6e5">execution triage</text></g>

<rect x="24" y="278" width="1152" height="2" fill="#0f62fe" opacity=".18"/><rect x="24" y="278" width="165" height="2" fill="#78a9ff" filter="url(#g)"><animate attributeName="x" values="24;1011;24" dur="20s" repeatCount="indefinite"/></rect>
</svg>