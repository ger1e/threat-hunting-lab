<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d"><title id="t">GER1E threat hunting doctrine terminal</title><desc id="d">Animated cobalt CRT terminal footer summarizing telemetry-first, provenance-preserved threat hunting doctrine.</desc><defs><radialGradient id="bg" cx="52%" cy="40%" r="92%"><stop stop-color="#0a2143"/><stop offset=".5" stop-color="#031022"/><stop offset="1" stop-color="#000207"/></radialGradient><linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a6e4ff" stop-opacity="0"/><stop offset=".5" stop-color="#a6e4ff" stop-opacity=".18"/><stop offset="1" stop-color="#a6e4ff" stop-opacity="0"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H4" stroke="#78a9ff" stroke-opacity=".032" stroke-width=".5"/></pattern><filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="f"><rect x="6" y="6" width="708" height="238" rx="12"/></clipPath><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;letter-spacing:1.1px}</style></defs><rect width="720" height="250" rx="12" fill="url(#bg)"/><g clip-path="url(#f)"><rect x="6" y="-70" width="708" height="72" fill="url(#sweep)" opacity=".7"><animate attributeName="y" values="-75;250" dur="8s" repeatCount="indefinite"/></rect></g><rect width="720" height="250" rx="12" fill="url(#scan)"/><rect x="6" y="6" width="708" height="238" rx="12" fill="none" stroke="#44d8ff" stroke-opacity=".24"/><g class="m" font-size="10" letter-spacing="1.4" fill="#739bc0"><text x="22" y="27">NODE://HUNTLAB</text><text x="698" y="27" text-anchor="end">PUBLIC SIGNAL // END OF LINE</text></g><g transform="translate(36 48)"><rect width="648" height="150" rx="6" fill="#07111f" fill-opacit