name: quality-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'hunts/**/*.kql'
      - 'prompts/**/*.md'
      - 'prompts/manifest.json'
      - 'docs/**/*.md'
      - 'assets/**/*.svg'
      - 'cti-schema.json'
      - 'README.md'
      - 'tests/**/*.py'
      - 'tools/kql-validate/**'
      - '.github/CODEOWNERS'
      - '.github/workflows/hunt-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.424'

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool cti-schema.json >/dev/null
          python -m json.tool prompts/manifest.json >/dev/null
          required_docs=(
            'docs/HUNTING-METHODOLOGY.md'
            'docs/CTI-NORMALIZATION.md'
            'docs/CTI-PROMPT-ORCHESTRATION.md'
            'prompts/README.md'
            'CONTRIBUTING.md'
            'SECURITY.md'
            '.github/CODEOWNERS'
          )
          for file in "${required_docs[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required repository contract is missing or empty."
              exit 1
            fi
          done
          grep -Fq 'docs/HUNTING-METHODOLOGY.md' README.md || exit 1
          grep -Fq 'docs/CTI-NORMALIZATION.md' README.md || exit 1
          grep -Fq 'prompts/README.md' README.md || exit 1
          echo 'Repository contracts: PASS'

      - name: Run hunt semantic regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate KQL syntax with Microsoft Kusto.Language
        run: dotnet run --project tools/kql-validate/KqlValidate.csproj -- hunts

      - name: Validate portfolio visuals
        shell: bash
        run: |
          set -euo pipefail
          required_assets=('assets/lab-signal.svg' 'assets/investigation-console.svg' 'assets/doctrine-terminal.svg')
          for asset in "${required_assets[@]}"; do
            [[ -s "$asset" ]] || exit 1
            python - "$asset" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          PY
            grep -Fq "$asset" README.md || exit 1
            grep -Fq 'values="25,-120;25,480" dur="18s" repeatCount="indefinite"' "$asset" || exit 1
            grep -Fq 'values="75,-260;75,340" dur="21s" repeatCount="indefinite"' "$asset" || exit 1
            grep -Fq 'class="r2"' "$asset" || exit 1
          done
          radar_assets=('assets/lab-signal.svg' 'assets/doctrine-terminal.svg')
          for asset in "${radar_assets[@]}"; do
            grep -Fq '<circle r="67" fill="#071a34" fill-opacity=".6" stroke="#47ddff" stroke-opacity=".25"/>' "$asset" || exit 1
            grep -Fq '<circle r="45" fill="none" stroke="#47ddff" stroke-opacity=".25"/>' "$asset" || exit 1
            grep -Fq '<circle r="23" fill="none" stroke="#47ddff" stroke-opacity=".2"/>' "$asset" || exit 1
            grep -Fq '<path d="M0 0H64" stroke="#72ecff" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></path>' "$asset" || exit 1
            if grep -Fq 'data-radar-sweep=' "$asset" || grep -Fq 'A56.5' "$asset"; then exit 1; fi
          done
          echo 'Portfolio visuals: PASS'

      - name: Validate KQL hunt contract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(hunts/**/*.kql)
          (( ${#files[@]} > 0 )) || exit 1
          required=('// Title:' '// Description:' '// Suspicious Behavior:' '// MITRE ATT&CK:' '// Pyramid of Pain:' '// Kill Chain:' '// Relevant CTI:')
          failed=0
          for file in "${files[@]}"; do
            size=$(wc -c < "$file")
            (( size <= 65536 )) || failed=1
            for header in "${required[@]}"; do grep -Fq "$header" "$file" || failed=1; done
            grep -Eq '^// Relevant CTI:.*https://' "$file" || failed=1
          done
          (( failed == 0 )) || exit 1
          echo "Hunt contract: PASS (${#files[@]} files)"
