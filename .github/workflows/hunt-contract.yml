name: quality-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'hunts/**/*.kql'
      - 'docs/**/*.md'
      - 'assets/**/*.svg'
      - 'cti-schema.json'
      - 'README.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/hunt-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail

          python -m json.tool cti-schema.json >/dev/null

          required_docs=(
            'docs/HUNTING-METHODOLOGY.md'
            'docs/CTI-NORMALIZATION.md'
            'CONTRIBUTING.md'
            'SECURITY.md'
            '.github/CODEOWNERS'
          )

          for file in "${required_docs[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required repository contract is missing or empty."
              exit 1
            fi
          done

          grep -Fq 'docs/HUNTING-METHODOLOGY.md' README.md || {
            echo '::error file=README.md::README must link the hunting methodology.'
            exit 1
          }

          grep -Fq 'docs/CTI-NORMALIZATION.md' README.md || {
            echo '::error file=README.md::README must link the CTI normalization model.'
            exit 1
          }

          echo 'Repository contracts: PASS'

      - name: Validate portfolio visuals
        shell: bash
        run: |
          set -euo pipefail

          required_assets=(
            'assets/lab-signal.svg'
            'assets/investigation-console.svg'
            'assets/doctrine-terminal.svg'
          )

          for asset in "${required_assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error file=$asset::Required portfolio visual is missing or empty."
              exit 1
            fi

            python - "$asset" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          PY

            grep -Fq "$asset" README.md || {
              echo "::error file=README.md::README must surface $asset."
              exit 1
            }

            grep -Fq 'values="25,-120;25,480" dur="18s" repeatCount="indefinite"' "$asset" || {
              echo "::error file=$asset::Visual must use the GER1E profile rain timing."
              exit 1
            }

            grep -Fq 'values="75,-260;75,340" dur="21s" repeatCount="indefinite"' "$asset" || {
              echo "::error file=$asset::Visual must preserve the GER1E profile rain cadence."
              exit 1
            }

            grep -Fq 'class="r2"' "$asset" || {
              echo "::error file=$asset::Visual must preserve the GER1E secondary rain layer."
              exit 1
            }
          done

          radar_assets=(
            'assets/lab-signal.svg'
            'assets/doctrine-terminal.svg'
          )

          for asset in "${radar_assets[@]}"; do
            grep -Fq '<circle r="67" fill="#071a34" fill-opacity=".6" stroke="#47ddff" stroke-opacity=".25"/>' "$asset" || {
              echo "::error file=$asset::Radar outer ring must match the GER1E profile radar."
              exit 1
            }

            grep -Fq '<circle r="45" fill="none" stroke="#47ddff" stroke-opacity=".25"/>' "$asset" || {
              echo "::error file=$asset::Radar middle ring must match the GER1E profile radar."
              exit 1
            }

            grep -Fq '<circle r="23" fill="none" stroke="#47ddff" stroke-opacity=".2"/>' "$asset" || {
              echo "::error file=$asset::Radar inner ring must match the GER1E profile radar."
              exit 1
            }

            grep -Fq '<path d="M0 0H64" stroke="#72ecff" stroke-width="2"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></path>' "$asset" || {
              echo "::error file=$asset::Radar arm must be the exact GER1E profile rotating line."
              exit 1
            }

            if grep -Fq 'data-radar-sweep=' "$asset" || grep -Fq 'A56.5' "$asset"; then
              echo "::error file=$asset::Custom radar wedge/dot implementation is forbidden."
              exit 1
            fi
          done

          echo 'Portfolio visuals: PASS'

      - name: Validate KQL hunt contract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          files=(hunts/**/*.kql)
          if (( ${#files[@]} == 0 )); then
            echo 'No KQL hunts found.' >&2
            exit 1
          fi

          required=(
            '// Title:'
            '// Description:'
            '// Suspicious Behavior:'
            '// MITRE ATT&CK:'
            '// Pyramid of Pain:'
            '// Kill Chain:'
            '// Relevant CTI:'
          )

          failed=0
          for file in "${files[@]}"; do
            echo "checking $file"

            size=$(wc -c < "$file")
            if (( size > 65536 )); then
              echo "::error file=$file::Hunt exceeds 64 KiB ($size bytes)."
              failed=1
            fi

            for header in "${required[@]}"; do
              if ! grep -Fq "$header" "$file"; then
                echo "::error file=$file::Missing required header: $header"
                failed=1
              fi
            done

            if ! grep -Eq '^// Relevant CTI:.*https://' "$file"; then
              echo "::error file=$file::Relevant CTI must include at least one HTTPS source."
              failed=1
            fi
          done

          if (( failed != 0 )); then
            exit 1
          fi

          echo "Hunt contract: PASS (${#files[@]} files)"
