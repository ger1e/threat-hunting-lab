name: Hunt quality / tuning
about: Report a query-quality, telemetry, ATT&CK, false-positive, or tuning problem
labels: [hunt-quality]
body:
  - type: markdown
    attributes:
      value: |
        Use this for public, sanitized hunt-quality problems. Do not include customer data, credentials, private infrastructure, or unpublished incident evidence.
  - type: input
    id: hunt
    attributes:
      label: Hunt
      description: Path or hunt name.
      placeholder: hunts/example.kql
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is incorrect, noisy, misleading, expensive, or incomplete?
    validations:
      required: true
  - type: textarea
    id: telemetry
    attributes:
      label: Telemetry assumptions
      description: Which table/data-source behavior matters to reproduce the issue?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / rationale
      description: Sanitized evidence, documentation, or public sources supporting the change.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-safety check
      options:
        - label: This report contains no customer data, credentials, private infrastructure, or unpublished incident evidence.
          required: true
